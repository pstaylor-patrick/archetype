[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archetype"
version = "0.1.0"
description = "Decompose engineering requirements into design concepts and weighted tradeoff matrices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Patrick Taylor", email = "patrick@pstaylor.net" },
]
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
archetype = "archetype.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archetype"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer evaluates annotations at runtime via typing.get_type_hints(),
# which fails with X | None on Python 3.9
"src/archetype/cli.py" = ["UP045"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
